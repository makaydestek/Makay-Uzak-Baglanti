name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Compile release Kotlin (smoke)
        run: |
          chmod +x gradlew
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace
      - name: Android lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
