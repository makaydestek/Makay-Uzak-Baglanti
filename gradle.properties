org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Proje yolu Turkce karakter (ı) iceriyor — Android Gradle Plugin'in resmi yol
# kontrolu bypass'i (b.android.com/95744). Davranis degisikligi yoktur.
android.overridePathCheck=true

# R8 full mode — AGP 8.0+ icin varsayilan. Burada BILINCLI olarak acik tutulur;
# bilerek "false" yazilmamalidir (daha derin optimizasyon + kucuk APK).
# model siniflarinin korunmasi icin bkz. app/proguard-rules.pro
android.enableR8.fullMode=true

# Experimental Material3 API uyarilarini sustur
android.suppressUnsupportedCompileSdk=36